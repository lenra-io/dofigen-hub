context:
  - /src
  - /package.json
  - /bun.lock
ignore:
  - /src/**/*.test.js
  - /src/**/*.test.ts
  - /src/**/*.test.jsx
  - /src/**/*.test.tsx
builders:
  bun-install:
    fromImage: oven/bun
    workdir: /app
    bind:
      - package.json
      - bun.lock
    # Install dependencies
    run: bun install --production --frozen-lockfile
    # Bun cache
    cache: /home/bun/.bun/install/cache
